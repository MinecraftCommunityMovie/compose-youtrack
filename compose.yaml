services:
  youtrack:
    image: jetbrains/youtrack:2026.1.13570
    container_name: youtrack
    restart: unless-stopped
    volumes:
      - /opt/docker-data/youtrack/data:/opt/youtrack/data
      - /opt/docker-data/youtrack/conf:/opt/youtrack/conf
      - /opt/docker-data/youtrack/logs:/opt/youtrack/logs
      - /opt/docker-data/youtrack/backups:/opt/youtrack/backups
    ports:
      - 127.0.0.1:1111:8080
